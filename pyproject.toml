[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-research"
version = "0.1.0"
description = "A production-shaped multi-agent deep research runtime."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.21.0,<1.0.0",
  "fastapi>=0.128.0,<1.0.0",
  "greenlet>=3.2.0,<4.0.0",
  "httpx>=0.28.1,<1.0.0",
  "langgraph>=1.0.8,<2.0.0",
  "openai>=1.68.0,<3.0.0",
  "opentelemetry-api>=1.35.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.35.0,<2.0.0",
  "opentelemetry-sdk>=1.35.0,<2.0.0",
  "orjson>=3.10.18,<4.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.9.0,<3.0.0",
  "prometheus-client>=0.23.1,<1.0.0",
  "textual>=6.6.0,<7.0.0",
  "sqlalchemy>=2.0.40,<3.0.0",
  "tenacity>=9.1.2,<10.0.0",
  "typing-extensions>=4.13.0,<5.0.0",
  "uvicorn>=0.35.0,<1.0.0",
  "python-multipart>=0.0.26",
  "langchain>=1.1.0,<2.0.0",
  "langchain-openai>=1.1.0,<2.0.0",
  "deepagents>=0.3.0,<1.0.0",
  "jinja2>=3.1.0,<4.0.0",
]

[project.scripts]
open-research = "open_research.cli:main"
ore = "open_research.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5,<9.0.0",
  "pytest-asyncio>=0.26.0,<1.0.0",
  "ruff>=0.12.0,<1.0.0",
]
browser = [
  "playwright>=1.55.0,<2.0.0",
]
grounding = [
  "sentence-transformers>=5.1.0,<6.0.0",
]
postgres = [
  "alembic>=1.16.0,<2.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "pgvector>=0.4.1,<1.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
]
storage = [
  "boto3>=1.40.0,<2.0.0",
]
temporal = [
  "temporalio>=1.11.1,<2.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_research = ["prompts/**/*.md.j2", "prompts/**/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]
